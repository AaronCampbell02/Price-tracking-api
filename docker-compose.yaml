services:
  db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: pricetracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db

volumes:
  pgdata: